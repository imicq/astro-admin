<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>博客后台管理</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/marked.min.js"></script>
  <script src="/js/md5.min.js"></script>
  <script src="/js/config.js"></script>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">📝 博客后台</div>
      <nav id="side-nav">
        <a data-view="dashboard" class="active">概览</a>
        <a data-view="posts">文章管理</a>
        <a data-view="moments">碎碎念</a>
        <a data-view="pages">独立页面</a>
        <a data-view="links">友链管理</a>
        <a data-view="settings">站点设置</a>
        <a data-view="comments">评论管理</a>
        <a data-view="tksettings">评论设置</a>
        <a data-view="publish">发布与构建</a>
      </nav>
      <div class="sidebar-footer">
        <div id="repo-info"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button id="btn-chpwd" class="btn ghost small" onclick="changePwd()">改密码</button>
          <button id="btn-logout" class="btn ghost small">退出登录</button>
        </div>
      </div>
    </aside>
    <main id="main"></main>
  </div>

  <!-- 待发布抽屉 -->
  <div id="publish-bar" class="publish-bar" hidden>
    <span id="publish-count">0 项改动待发布</span>
    <button id="btn-publish" class="btn primary">🚀 发布更改（1 次构建）</button>
    <a id="queue-link" href="#/publish">查看队列</a>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="confirm-mask" class="confirm-mask" hidden>
    <div class="confirm-box">
      <p id="confirm-text"></p>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn ghost" onclick="closeConfirm(false)">取消</button>
        <button class="btn danger" onclick="closeConfirm(true)">确定</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
